version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 975049967009.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=975049967009.dkr.ecr.us-east-1.amazonaws.com/lms-backend
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION

  build:
    commands:
      - echo Build started on `date`
      - echo Building backend Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG ./backend

  post_build:
    commands:
      - echo Pushing backend image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Creating imagedefinitions.json...
      - printf '[{"name":"backend","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json
      - echo Build completed on `date`

artifacts:
  files:
    - imagedefinitions.json
